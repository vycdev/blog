server {
    listen 8080;
    server_name _;
    root /srv/www;
    index index.html;

    charset utf-8;
    charset_types text/css text/xml text/plain application/javascript application/json application/rss+xml image/svg+xml;

    # Sits behind a reverse proxy: send relative redirects (/Projects -> /Projects/)
    # instead of absolute ones that would leak http://...:8080.
    absolute_redirect off;

    # Quartz emits page.html but links to /page; folders are folder/index.html.
    location / {
        try_files $uri $uri.html $uri/ @strip_slash;
    }

    # /page/ -> /page, like Quartz's own server; anything else is a real 404.
    location @strip_slash {
        rewrite ^(.+)/$ $1 permanent;
        return 404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json text/xml application/xml application/rss+xml image/svg+xml text/plain;
}
